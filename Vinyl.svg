<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer vinyl record with gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#gradient1)"/>

  <!-- Grooves (concentric circles) -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="2"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="2"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="2"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="2"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="2"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="2"/>

  <!-- Center label with vibrant gradient -->
  <circle cx="256" cy="256" r="100" fill="url(#gradient2)"/>

  <!-- Center hole -->
  <circle cx="256" cy="256" r="20" fill="#1a1a1a"/>

  <!-- Musical note decorations -->
  <g transform="translate(256, 256)">
    <!-- Note 1 -->
    <circle cx="-40" cy="-10" r="8" fill="white" opacity="0.9"/>
    <rect x="-38" y="-40" width="3" height="30" fill="white" opacity="0.9"/>

    <!-- Note 2 -->
    <circle cx="30" cy="0" r="8" fill="white" opacity="0.9"/>
    <rect x="32" y="-35" width="3" height="35" fill="white" opacity="0.9"/>
    <path d="M 35 -35 Q 50 -30 45 -20" stroke="white" stroke-width="3" fill="none" opacity="0.9"/>
  </g>

  <!-- Gradients -->
  <defs>
    <!-- Outer vinyl gradient - purple to blue -->
    <radialGradient id="gradient1" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </radialGradient>

    <!-- Center label gradient - pink to orange -->
    <radialGradient id="gradient2" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#F472B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FB923C;stop-opacity:1" />
    </radialGradient>
  </defs>
</svg>
